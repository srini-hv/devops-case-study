apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-alerts
  namespace: postgres
  labels:
    release: prometheus-operator
spec:
  groups:
    - name: postgres
      rules:
        - alert: PostgreSQLUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="postgres",
              deployment="postgres"
            } < 1
          for: 5m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: PostgreSQL is not available
            description: PostgreSQL has no available replica for at least five minutes.
            action: Check the PostgreSQL pod, readiness probe, storage, and container logs.

        - alert: PostgreSQLContainerRestarts
          expr: |
            sum(
              increase(
                kube_pod_container_status_restarts_total{
                  namespace="postgres",
                  container="postgres"
                }[15m]
              )
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: PostgreSQL is restarting repeatedly
            description: The PostgreSQL container has restarted more than twice during the last fifteen minutes.
            action: Check PostgreSQL logs, storage, memory limits, and recent configuration changes.
        - alert: PostgreSQLHighRollbackRate
          expr: |
            100 *
            sum(rate(pg_stat_database_xact_rollback[5m]))
            /
            clamp_min(
              sum(rate(pg_stat_database_xact_commit[5m]))
              + sum(rate(pg_stat_database_xact_rollback[5m])),
              1
            )
            > 5
          for: 5m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: PostgreSQL is rolling back many transactions
            description: More than 5% of PostgreSQL transactions have rolled back during the last five minutes.
            action: Check application errors, constraint violations, lock contention, and recent database changes.

        - alert: PostgreSQLDeadlocksDetected
          expr: |
            sum(
              increase(
                pg_stat_database_deadlocks[15m]
              )
            ) > 0
          for: 5m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: PostgreSQL deadlocks were detected
            description: PostgreSQL has recorded one or more deadlocks during the last fifteen minutes.
            action: Check blocked transactions, lock ordering, long-running queries, and application retry behavior.
